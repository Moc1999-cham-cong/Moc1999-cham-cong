<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mộc 1999 - Chấm công</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f3f3f3;color:#191919}
header{background:#151515;color:#fff;padding:18px;font-weight:800;font-size:18px}.wrap{max-width:1000px;margin:auto;padding:14px}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 18px #0001}.tabs{display:flex;gap:7px;overflow:auto}
button,select,input{font:inherit;padding:12px;border-radius:11px;border:1px solid #ddd}button{background:#151515;color:#fff;border:0;cursor:pointer}button.gray{background:#777}
select,input{width:100%;margin:5px 0 10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.big{font-size:32px;font-weight:800;margin:12px 0}.success{background:#eaf8ec;padding:11px;border-radius:10px}.error{background:#ffeded;padding:11px;border-radius:10px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.hide{display:none}.muted{color:#777}
@media(max-width:650px){.grid{grid-template-columns:1fr}th,td{font-size:12px}}
</style></head><body><header>CTY TNHH MỘC 1999 · CHẤM CÔNG ONLINE</header><div class="wrap">
<div class="tabs"><button onclick="tab('staff')">📱 Nhân viên</button><button onclick="tab('manager')">🔐 Quản lý</button></div>
<section id="staff" class="card"><h2>Chấm công</h2>
<div id="login"><label>Nhân viên</label><select id="eid"></select><label>Mật khẩu</label><input id="pw" type="password" value="123456"><button onclick="login()">Đăng nhập</button></div>
<div id="work" class="hide"><b id="who"></b><div class="big" id="clock"></div><button onclick="punch('in')">VÀO CA</button> <button class="gray" onclick="punch('out')">RA CA</button><p id="status" class="muted"></p><button class="gray" onclick="logout()">Đăng xuất</button></div><div id="msg"></div></section>

<section id="manager" class="card hide"><h2>Quản lý</h2><div id="mlog"><input id="akey" type="password" placeholder="Mã quản lý"><button onclick="manager()">Đăng nhập</button></div><div id="mapp" class="hide">
<h3>📲 QR chấm công tại công ty</h3>
<div id="qrbox"><button onclick="showQR()">Hiện QR chấm công</button></div>
<p class="muted">QR tự đổi mỗi 30 giây. Nhân viên quét QR rồi đăng nhập/chấm công; GPS vẫn được kiểm tra.</p>
<h3>Thêm nhân viên</h3><div class="grid"><input id="n" placeholder="Họ tên"><input id="phone" placeholder="SĐT"><input id="dept" placeholder="Bộ phận"><input id="sal" type="number" placeholder="Lương tháng"><input id="std" type="number" value="26" placeholder="Ngày chuẩn"><input id="otr" type="number" placeholder="Đơn giá OT/giờ"><input id="epw" value="123456" placeholder="Mật khẩu nhân viên"></div><button onclick="add()">Thêm nhân viên</button>
<h3>Báo cáo</h3><input id="month" type="month"><button onclick="report()">Xem báo cáo</button><button class="gray" onclick="csv()">Xuất CSV</button><div id="rep"></div>
<h3>Lịch sử thao tác</h3><button class="gray" onclick="audit()">Xem</button><div id="aud"></div></div></section></div>
<script>
let token='',employees=[],cfg={},qrTokenValue=new URLSearchParams(location.search).get('qr')||'';
const $=x=>document.getElementById(x);
async function api(u,o={}){let r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error||'Lỗi');return j}
async function init(){employees=await api('/api/employees');$('eid').innerHTML=employees.map(e=>`<option value="${e.id}">${e.name}${e.dept?' · '+e.dept:''}</option>`).join('');cfg=await api('/api/config');$('month').value=new Date().toISOString().slice(0,7);setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString('vi-VN'),1000)}
async function login(){try{let j=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({employeeId:+$('eid').value,password:$('pw').value})});token=j;localStorage.setItem('moc_emp',JSON.stringify(j));$('login').classList.add('hide');$('work').classList.remove('hide');$('who').textContent=j.name;loadToday()}catch(e){$('msg').innerHTML='<div class="error">'+e.message+'</div>'}}
function logout(){localStorage.removeItem('moc_emp');location.reload()}
async function loadToday(){let j=await api('/api/my-today',{headers:{'x-employee-id':token.id,'x-employee-password':$('pw').value}});$('status').textContent=j.time_in?`Hôm nay: vào ${j.time_in}${j.time_out?' · ra '+j.time_out:''}`:'Chưa chấm công hôm nay'}
async function punch(type){if(!navigator.geolocation)return $('msg').innerHTML='<div class="error">Thiết bị không hỗ trợ GPS</div>';navigator.geolocation.getCurrentPosition(async p=>{try{let j=await api('/api/punch/'+type,{method:'POST',headers:{'Content-Type':'application/json','x-employee-id':token.id,'x-employee-password':$('pw').value},body:JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude,qrToken:qrTokenValue})});$('msg').innerHTML=`<div class="success">Đã ${type==='in'?'VÀO CA':'RA CA'} lúc <b>${j.time}</b> · cách điểm ${j.distance}m</div>`;loadToday()}catch(e){$('msg').innerHTML='<div class="error">'+e.message+'</div>'}},{enableHighAccuracy:true,timeout:10000})}
function tab(x){$('staff').classList.toggle('hide',x!=='staff');$('manager').classList.toggle('hide',x!=='manager')}
let key='';function manager(){key=$('akey').value;$('mlog').classList.add('hide');$('mapp').classList.remove('hide')}
async function add(){try{await api('/api/employees',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify({name:$('n').value,phone:$('phone').value,dept:$('dept').value,salary:$('sal').value,standard:$('std').value,otRate:$('otr').value,password:$('epw').value})});location.reload()}catch(e){alert(e.message)}}
async function showQR(){
 try{
  let j=await api('/api/qr',{headers:{'x-admin-key':key}});
  $('qrbox').innerHTML=`<img src="${j.data}" style="width:280px;max-width:100%;display:block;margin:10px auto"><div class="muted" style="text-align:center">QR đổi sau ${j.expiresIn} giây</div>`;
  setTimeout(showQR,28000);
 }catch(e){$('qrbox').innerHTML='<div class="error">'+e.message+'</div>'}
}
async function report(){try{let a=await api('/api/report?month='+$('month').value,{headers:{'x-admin-key':key}});let m={};a.forEach(r=>{let x=m[r.employee_id]||{name:r.name,days:0,h:0,ot:0};if(r.time_in)x.days++;x.h+=r.hours;x.ot+=r.ot;m[r.employee_id]=x});$('rep').innerHTML='<table><tr><th>Nhân viên</th><th>Ngày</th><th>Giờ</th><th>OT</th></tr>'+Object.values(m).map(x=>`<tr><td>${x.name}</td><td>${x.days}</td><td>${x.h.toFixed(2)}</td><td>${x.ot.toFixed(2)}</td></tr>`).join('')+'</table>';window._rows=a}catch(e){alert(e.message)}}
function csv(){let a=window._rows||[];let s='Ngày,Nhân viên,Vào,Ra,Giờ,OT\\n'+a.map(x=>`${x.work_date},${x.name},${x.time_in||''},${x.time_out||''},${x.hours},${x.ot}`).join('\\n');let b=new Blob(['\\ufeff'+s],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a1=document.createElement('a');a1.href=u;a1.download='Moc1999_ChamCong.csv';a1.click();URL.revokeObjectURL(u)}
async function audit(){let a=await api('/api/audit',{headers:{'x-admin-key':key}});$('aud').innerHTML='<table><tr><th>Thời gian</th><th>NV</th><th>Hành động</th><th>Chi tiết</th></tr>'+a.map(x=>`<tr><td>${x.created_at}</td><td>${x.name||''}</td><td>${x.action}</td><td>${x.detail||''}</td></tr>`).join('')+'</table>'}
init();
</script></body></html>
